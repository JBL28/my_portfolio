# deploy/nginx/default.conf — 공개 진입점 Nginx (01_설계.md 8.4, 02_구현계획.md 0장)
#
# 배포 형상(1장 경로 B — 홈서버 내부 배포, 02_구현계획.md 0장에서 확정):
#
#   Browser ── HTTPS ──> Cloudflare Tunnel ──> [이 Nginx] ──> web(Next.js) ──> ai-server(FastAPI)
#
# - TLS는 Cloudflare Tunnel이 종단하므로 내부 구간은 HTTP(80)만 받는다
#   (포트폴리오 원문: "공개 서비스는 Cloudflare Tunnel → Nginx로 접근 경계 분리").
# - ai-server/Neo4j/Phoenix는 이 Nginx가 속하지 않은 내부 네트워크에만 있어
#   외부에서 도달할 수 없다(docker-compose.yml의 edge/internal 분리).
#
# requestId 로그(8.6이 구현 단계 결정으로 위임한 항목):
# requestId는 BFF(Next.js)가 생성하고(8.1) 응답 헤더 X-Request-ID로 되돌려주므로
# $sent_http_x_request_id로 access log에 남긴다. rate limit으로 여기서 차단된(429)
# 요청은 BFF에 도달하지 못해 requestId가 발급되지 않는다 — 8.4의 "Nginx 단계에서
# 차단된 요청은 애초에 Trace가 없다"와 같은 원리로, 그런 행은 request_id가 빈 값으로
# 남고, requestId는 FastAPI까지 도달한 요청의 로그·trace를 잇는 상관관계 키로 쓰인다.
log_format portfolio '$remote_addr - [$time_local] "$request" $status '
                     '$body_bytes_sent rt=$request_time '
                     'request_id="$sent_http_x_request_id"';

# 8.4: "요청 폭주·반복 호출 같은 전통적 abuse는 Nginx/BFF 계층의 rate limiting으로
# 처리한다". /api/chat은 턴 하나가 OpenAI 호출을 최대 4번(8.3) 유발하는 고비용 경로라
# IP당 분당 10회 + burst 5로 시작한다 — 8.6 원칙(데이터가 쌓이기 전까지는 보수적
# 초기값, 이후 실측으로 재조정)을 따르는 초기값이다.
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=10r/m;

upstream web {
    server web:3000;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log portfolio;

    location /api/chat {
        limit_req zone=chat_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
