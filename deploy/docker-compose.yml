# deploy/docker-compose.yml — 7단계 배포(02_구현계획.md 1장)
# 근거: 01_설계.md 0장(홈서버 Docker), 1장 경로 B(홈서버 내부 배포 — 02_구현계획.md
# 0장에서 확정), 8.4(rate limiting·requestId 로그), 8.5(Phoenix + SQLite).
#
# 실행:        deploy/ 에서  docker compose up -d --build   (.env 필요 — .env.example 참고)
# 그래프 재적재: docker compose exec ai-server python scripts/load_graph.py
#              (data/ 수정 후 항상 실행 — 01_설계.md 4장 동기화 규칙. data/는 아래
#               바인드 마운트로 컨테이너에 실시간 반영되므로 이미지 리빌드가 필요 없다.
#               단 웹 화면(SSG)은 빌드 타임 산출물이므로 web 이미지는 리빌드해야 한다.)
#
# 네트워크 경계(1장 핵심 원칙 — 브라우저는 FastAPI 주소를 알 수 없다):
#   edge     : nginx ↔ web              (공개 트래픽이 흐르는 구간)
#   internal : web ↔ ai-server ↔ neo4j/phoenix  (외부에서 도달 불가)
# 호스트에 노출되는 포트는 nginx(공개, Cloudflare Tunnel이 가리키는 지점)와
# 관리용 localhost 바인드(Neo4j Browser, Phoenix UI — 8.6: "접근 범위가 홈서버 내부
# 도구로 한정")뿐이다.

name: portfolio

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      # Cloudflare Tunnel(cloudflared)이 이 포트를 가리킨다. TLS는 Tunnel이 종단.
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks: [edge]
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      # 1장: AI 서버 주소는 Next.js 서버 프로세스만 안다 — 내부 네트워크 주소이며
      # NEXT_PUBLIC_ 접두사가 아니므로 클라이언트 번들에 노출되지 않는다.
      AI_SERVER_URL: http://ai-server:8000
    depends_on:
      - ai-server
    networks: [edge, internal]
    restart: unless-stopped

  ai-server:
    build:
      context: ..
      dockerfile: apps/ai-server/Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Gate1/Gate2/Extract/Generate는 Upstage Solar를 기본으로 쓰고 실패 시 OpenAI로
      # 폴백한다(app/pipeline/dispatch.py). 질의 임베딩은 프로바이더와 무관하게 항상
      # OpenAI다 — Upstage 임베딩은 4096차원이라 db/schema.cypher의 1536차원 인덱스와
      # 맞지 않는다. 따라서 OPENAI_API_KEY는 여전히 사실상 필수다.
      UPSTAGE_API_KEY: ${UPSTAGE_API_KEY:-}
      # auto: 키가 있는 쪽을 자동 선택(둘 다면 Upstage 우선 + OpenAI 폴백).
      # upstage / openai: 해당 프로바이더로 고정하고 폴백하지 않는다.
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      # Gate 2 안내에 쓸 저장소 공개 URL(app/config.py) — 비우면 링크 없이 안내만 한다.
      GITHUB_REPO_URL: ${GITHUB_REPO_URL:-}
      # 8.5: FastAPI는 OTLP로 export만 한다. OTLPSpanExporter가 이 표준 환경변수를
      # 읽어 http://phoenix:6006/v1/traces 로 전송한다(app/observability/tracing.py).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:6006
    volumes:
      # data/ 수정 → 재적재(01_설계.md 4장 8번)를 이미지 리빌드 없이 실행할 수 있도록
      # 저장소의 data/를 읽기 전용으로 바인드한다(이미지에 COPY된 사본을 덮는다).
      - ../data:/srv/data:ro
    depends_on:
      neo4j:
        condition: service_healthy
      phoenix:
        condition: service_started
    networks: [internal]
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      # N100급 홈서버 기준 보수적 메모리 상한 — 현재 데이터 규모(Section 20개 내외,
      # 벡터 1536차원 × searchable 15개 내외)에 충분하며, 필요 시 상향한다.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j-data:/data
    ports:
      # 관리용(Neo4j Browser/bolt) — localhost에만 바인드, SSH/Tailscale 경유로만 접근.
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [internal]
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:latest
    environment:
      # 8.5: 저장소는 SQLite로 시작(working dir 하위에 생성) — 트래픽이 늘어 필요해지면
      # PostgreSQL로 전환한다.
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix-data:/mnt/data
    ports:
      # 관측성 UI — 8.6: "접근 범위가 홈서버 내부 도구로 한정" → localhost에만 바인드.
      - "127.0.0.1:6006:6006"
    networks: [internal]
    restart: unless-stopped

networks:
  edge:
  internal:

volumes:
  neo4j-data:
  phoenix-data:
