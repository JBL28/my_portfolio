# deploy/server-compose.yml — 홈서버(Portainer 스택)용 배포 형상
#
# deploy/docker-compose.yml과의 차이는 하나다: **저장소가 없는 곳에서 돈다.**
# Portainer 웹 에디터 스택은 서버에 체크아웃된 저장소를 갖지 않으므로, 로컬용 compose가
# 쓰는 세 가지를 그대로 쓸 수 없다.
#
#   1) build:                → image: 로 교체. CI가 Docker Hub에 올린 것을 받는다.
#   2) ../data 바인드 마운트  → 삭제. 이미지가 data/를 COPY해 담고 있다(각 Dockerfile).
#   3) ./nginx/default.conf  → 아래 configs 블록에 본문을 그대로 넣었다.
#
# 2)의 결과로 **data/ 를 고치면 이미지를 다시 만들어야 한다.** 로컬에서는 바인드 마운트
# 덕에 재적재만으로 끝났지만, 서버에서는 main에 push → CI가 이미지 재빌드 → 배포가
# 정상 경로다. 웹 화면(SSG)이 어차피 빌드 타임 산출물이라 로컬에서도 web은 리빌드가
# 필요했으므로, 서버에서는 그 규칙이 ai-server에도 똑같이 적용되는 셈이다.
#
# 그래프 재적재(data/ 변경분을 Neo4j에 반영):
#   docker exec <ai-server 컨테이너> python /srv/apps/ai-server/scripts/load_graph.py
#
# 네트워크 경계는 로컬과 동일하다:
#   edge     : nginx ↔ web              (공개 트래픽)
#   internal : web ↔ ai-server ↔ neo4j/phoenix  (외부에서 도달 불가)
#
# name: 은 두지 않는다 — Portainer가 스택 이름으로 프로젝트명을 정한다.

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      # Cloudflare Tunnel(cloudflared)이 이 포트를 가리킨다. TLS는 Tunnel이 종단.
      - "${NGINX_HTTP_PORT:-8080}:80"
    configs:
      - source: nginx_default_conf
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      - web
    networks: [edge]
    restart: unless-stopped

  web:
    # CI(.github/workflows/ci.yml)가 push하는 이미지. Portainer 스택 환경변수로 지정한다.
    image: ${WEB_IMAGE}
    environment:
      # AI 서버 주소는 Next.js 서버 프로세스만 안다 — 내부 네트워크 주소이며
      # NEXT_PUBLIC_ 접두사가 아니므로 클라이언트 번들에 노출되지 않는다.
      AI_SERVER_URL: http://ai-server:8000
    depends_on:
      - ai-server
    networks: [edge, internal]
    restart: unless-stopped

  ai-server:
    image: ${AI_SERVER_IMAGE}
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Gate1/Gate2/Extract/Generate는 Upstage Solar를 기본으로 쓰고 실패 시 OpenAI로
      # 폴백한다. 질의 임베딩은 프로바이더와 무관하게 항상 OpenAI다 — Upstage 임베딩은
      # 4096차원이라 db/schema.cypher의 1536차원 인덱스와 맞지 않는다. 따라서
      # OPENAI_API_KEY는 여전히 사실상 필수다.
      UPSTAGE_API_KEY: ${UPSTAGE_API_KEY:-}
      # auto: 키가 있는 쪽을 자동 선택(둘 다면 Upstage 우선 + OpenAI 폴백).
      # upstage / openai: 해당 프로바이더로 고정하고 폴백하지 않는다.
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      # Gate 2 안내에 쓸 저장소 공개 URL — 비우면 링크 없이 안내만 한다.
      GITHUB_REPO_URL: ${GITHUB_REPO_URL:-}
      # FastAPI는 OTLP로 export만 한다. OTLPSpanExporter가 이 표준 환경변수를 읽어
      # http://phoenix:6006/v1/traces 로 전송한다.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:6006
    # 바인드 마운트 없음 — data/는 이미지 안(/srv/data)에 있다(파일 상단 2번 참고).
    depends_on:
      neo4j:
        condition: service_healthy
      phoenix:
        condition: service_started
    networks: [internal]
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      # N100급 홈서버 기준 보수적 메모리 상한 — 현재 데이터 규모(Section 20개 내외,
      # 벡터 1536차원 × searchable 18개 내외)에 충분하며, 필요 시 상향한다.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j-data:/data
    ports:
      # 관리용(Neo4j Browser/bolt) — localhost에만 바인드, SSH/Tailscale 경유로만 접근.
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [internal]
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:latest
    environment:
      # 저장소는 SQLite로 시작(working dir 하위에 생성) — 트래픽이 늘어 필요해지면
      # PostgreSQL로 전환한다.
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix-data:/mnt/data
    ports:
      # 관측성 UI — 접근 범위를 홈서버 내부로 한정하기 위해 localhost에만 바인드.
      - "127.0.0.1:6006:6006"
    networks: [internal]
    restart: unless-stopped

networks:
  edge:
  internal:

volumes:
  neo4j-data:
  phoenix-data:

# deploy/nginx/default.conf의 본문. 저장소 파일을 마운트할 수 없으므로 여기 담는다.
#
# **nginx 변수의 $는 전부 $$로 이스케이프했다.** compose가 $var를 환경변수로 보고
# 치환해버리기 때문이다($host가 빈 문자열이 되면 프록시가 통째로 깨진다). 원본
# deploy/nginx/default.conf를 고치면 이쪽도 같이 고치고 $ 이스케이프를 다시 확인한다.
configs:
  nginx_default_conf:
    content: |
      # requestId는 BFF(Next.js)가 생성하고 응답 헤더 X-Request-ID로 되돌려주므로
      # $$sent_http_x_request_id로 access log에 남긴다. rate limit으로 차단된(429)
      # 요청은 BFF에 도달하지 못해 requestId가 없으므로 그 행은 빈 값으로 남는다.
      log_format portfolio '$$remote_addr - [$$time_local] "$$request" $$status '
                           '$$body_bytes_sent rt=$$request_time '
                           'request_id="$$sent_http_x_request_id"';

      # /api/chat은 턴 하나가 LLM 호출을 여러 번 유발하는 고비용 경로라 IP당 분당 10회
      # + burst 5로 시작한다. 실측이 쌓이면 재조정한다.
      limit_req_zone $$binary_remote_addr zone=chat_limit:10m rate=10r/m;

      upstream web {
          server web:3000;
      }

      server {
          listen 80;
          server_name _;

          access_log /var/log/nginx/access.log portfolio;

          location /api/chat {
              limit_req zone=chat_limit burst=5 nodelay;
              limit_req_status 429;

              proxy_pass http://web;
              proxy_set_header Host $$host;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
          }

          location / {
              proxy_pass http://web;
              proxy_set_header Host $$host;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
          }
      }
